<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Dashboard - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 90%;
            padding: 40px 20px;
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 0.95rem;
        }
        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .option-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px 25px;
            text-decoration: none;
            color: #f8fafc;
            transition: all 0.3s ease;
            cursor: pointer;
            display: block;
        }
        .option-card:hover {
            transform: translateY(-4px);
            border-color: #10b981;
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.15);
        }
        .option-card .icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
        .option-card h2 {
            font-size: 1.3rem;
            margin-bottom: 6px;
        }
        .option-card p {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .option-card .badge {
            display: inline-block;
            background: #10b981;
            color: #0f172a;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 10px;
        }
        .footer {
            text-align: center;
            color: #475569;
            font-size: 0.75rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 SMS Dashboard</h1>
        <p class="subtitle">Choose how you want to view your messages</p>

        <div class="card-grid">
            <a href="all-sms.html" class="option-card">
                <div class="icon">📨</div>
                <h2>All SMS</h2>
                <p>View all messages from all devices in real-time</p>
                <span class="badge">Live Feed</span>
            </a>

            <a href="devices.html" class="option-card">
                <div class="icon">📋</div>
                <h2>Device Manager</h2>
                <p>View devices and filter messages by specific device</p>
                <span class="badge">By Device</span>
            </a>
        </div>

        <div class="footer">⚡ Real-time SMS monitoring system</div>
    </div>
</body>
</html>
