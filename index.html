<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live SMS Dashboard</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .sms-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #10b981;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .time {
            color: #94a3b8;
            font-weight: normal;
        }
        .msg {
            margin: 0;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .info {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 8px;
            border-top: 1px dashed #334155;
            padding-top: 5px;
        }
        .error {
            color: #ef4444;
            padding: 20px;
            text-align: center;
        }
        .loading {
            color: #94a3b8;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>📱 Live SMS Feed</h2>
            <div id="counter">Connecting...</div>
        </div>
        <div id="sms-container">
            <div class="loading">⏳ Loading messages...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Public database - only databaseURL needed
        const app = initializeApp({
            databaseURL: "https://sb-rex-11-default-rtdb.asia-southeast1.firebasedatabase.app"
        });
        
        const db = getDatabase(app);
        const container = document.getElementById('sms-container');
        const counter = document.getElementById('counter');

        console.log("📡 Connecting to Firebase...");

        // Listen to the 'smsData' node (where your data actually is)
        const smsRef = ref(db, 'smsData');
        
        onValue(smsRef, (snapshot) => {
            const data = snapshot.val();
            
            if (!data) {
                container.innerHTML = '<div class="error">📭 No SMS data available</div>';
                counter.innerText = "0 messages";
                return;
            }

            // Convert object to array of messages
            const messagesList = Object.values(data);
            
            // Sort by time (newest first)
            messagesList.sort((a, b) => {
                if (a.time > b.time) return -1;
                if (a.time < b.time) return 1;
                return 0;
            });

            console.log(`✅ Loaded ${messagesList.length} messages`);
            counter.innerText = `${messagesList.length} messages`;
            container.innerHTML = '';

            if (messagesList.length === 0) {
                container.innerHTML = '<div class="error">📭 No messages found</div>';
                return;
            }

            // Display messages
            messagesList.forEach((sms) => {
                const sender = sms.sender || "Unknown";
                const message = sms.message || "";
                const time = sms.time || "N/A";
                const info = sms.info || "";
                const deviceId = sms.deviceId || "";

                const card = document.createElement('div');
                card.className = 'sms-card';
                card.innerHTML = `
                    <div class="meta">
                        <span>📨 ${sender}</span>
                        <span class="time">🕐 ${time}</span>
                    </div>
                    <p class="msg">${message}</p>
                    ${info ? `<div class="info">⚙️ ${info}</div>` : ''}
                    ${deviceId ? `<div class="info">📱 ${deviceId}</div>` : ''}
                `;
                container.appendChild(card);
            });

        }, (error) => {
            console.error("❌ Firebase error:", error);
            container.innerHTML = `
                <div class="error">
                    ❌ Error connecting to database<br>
                    <small>${error.message}</small>
                </div>
            `;
            counter.innerText = "Error";
        });

        console.log("📡 Listening on path: /smsData");
    </script>
</body>
</html>
