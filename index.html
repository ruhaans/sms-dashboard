<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live SMS Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-indicator {
            width: 10px;
            height: 10px;
            background-color: var(--accent);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .search-box:focus {
            outline: 2px solid var(--accent);
        }

        #sms-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sms-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .sms-card:hover {
            transform: translateY(-2px);
        }

        .sms-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .sender-badge {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .device-info {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 8px;
            border-top: 1px dashed var(--border);
            padding-top: 8px;
        }

        .timestamp {
            color: var(--text-muted);
        }

        .message-body {
            margin: 0;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .no-data {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }

        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><span class="live-indicator"></span> Live SMS Feed</h1>
            <div id="counter" style="color: var(--text-muted); font-size: 0.9rem;">Connecting...</div>
        </header>

        <div id="error-container"></div>

        <input type="text" id="search" class="search-box" placeholder="🔍 Filter by sender, message content, or device...">

        <div id="sms-container">
            <div class="no-data">Connecting to secure database stream...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const dbURL = "https://sb-rex-11-default-rtdb.asia-southeast1.firebasedatabase.app";
        const app = initializeApp({ databaseURL: dbURL });
        const db = getDatabase(app);
        
        // Target 'common' node directly 
        const smsRef = ref(db, 'common'); 

        let localSmsCache = [];

        // Try Live WebSocket Stream
        onValue(smsRef, (snapshot) => {
            const data = snapshot.val();
            processData(data);
        }, (error) => {
            console.warn("WebSocket stream blocked by rules. Falling back to HTTP REST interface...", error);
            showError("Real-time WebSocket connection restricted by Firebase Database Rules. Attempting HTTP fallback extraction...");
            fetchFallback();
        });

        // Backup HTTP REST Data Fetcher (Bypasses local socket block errors)
        function fetchFallback() {
            fetch(`${dbURL}/common.json`)
                .then(res => res.json())
                .then(data => {
                    processData(data);
                    // Automatically re-fetch every 5 seconds to keep it pseudo-live
                    setTimeout(fetchFallback, 5000); 
                })
                .catch(err => {
                    document.getElementById('sms-container').innerHTML = `
                        <div class="no-data" style="color: #ef4444;">
                            ⚠️ Connection Failed.<br>
                            Ensure your Firebase Database Rules allow public 'read' access.
                        </div>`;
                });
        }

        function processData(data) {
            if (!data) {
                document.getElementById('sms-container').innerHTML = '<div class="no-data">No data found under "common" node.</div>';
                document.getElementById('counter').innerText = '0 messages';
                return;
            }

            // Convert object properties map to ordered array and reverse (Newest First)
            localSmsCache = Object.entries(data)
                .filter(([id, sms]) => sms && (sms.sender || sms.message))
                .reverse(); 
            
            document.getElementById('counter').innerText = `${localSmsCache.length} messages received`;
            renderList(localSmsCache);
        }

        function renderList(items) {
            const container = document.getElementById('sms-container');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<div class="no-data">No matching messages found.</div>';
                return;
            }

            items.forEach(([id, sms]) => {
                const sender = sms.sender || "Unknown Sender";
                const message = sms.message || "(Empty Message)";
                const time = sms.time || "N/A";
                const info = sms.info || "";

                const card = document.createElement('div');
                card.className = 'sms-card';
                card.innerHTML = `
                    <div class="sms-meta">
                        <span class="sender-badge">${escapeHtml(sender)}</span>
                        <span class="timestamp">${escapeHtml(time)}</span>
                    </div>
                    <p class="message-body">${escapeHtml(message)}</p>
                    ${info ? `<div class="device-info">⚙️ ${escapeHtml(info)}</div>` : ''}
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = localSmsCache.filter(([id, sms]) => {
                return (
                    (sms.sender && sms.sender.toLowerCase().includes(query)) ||
                    (sms.message && sms.message.toLowerCase().includes(query)) ||
                    (sms.info && sms.info.toLowerCase().includes(query))
                );
            });
            renderList(filtered);
        });

        function showError(msg) {
            document.getElementById('error-container').innerHTML = `<div class="error-box">💡 ${msg}</div>`;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
